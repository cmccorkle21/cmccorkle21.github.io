<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:title" content="Cole McCorkle"/>
    <meta property="og:image" content="img/circlePortrait.jpg"/>
    <title>{{ page.title }} - {{ site.title }}</title>
    <meta name="description" content="Cole McCorkle is a full time student at Elon Universtiy in Elon, NC. He has over five years of experience programming, in Java, Python, SQL, Ruby, SAS, HTML, CSS, SCSS, as well as general web development.">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/app.css">
    <link rel="shortcut icon" type="image/png"
          {% if site.favicon %} href="{{ site.favicon | prepend: site.baseurl }}" {% else %} href="{{ site.baseurl }}/favicon.png" {% endif %}
    />
    <script defer src="https://use.fontawesome.com/releases/v5.3.1/js/all.js"></script>
    {% seo %}
    {%- if site.google_analytics -%}
      {%- include google-analytics.html -%}
    {%- endif -%}
    {%- include head-scripts.html -%}
</head>
